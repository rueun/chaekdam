pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      run: pnpm exec oxlint --fix {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
      stage_fixed: true
    - name: eslint
      run: pnpm exec eslint --fix {staged_files}
      glob: "*.{ts,tsx,js,jsx}"
      stage_fixed: true
