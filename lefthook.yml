pre-commit:
  parallel: true
  jobs:
    - name: oxlint
      run: pnpm exec oxlint --fix {staged_files}
      glob: '*.{ts,tsx,js,jsx}'
      stage_fixed: true
    - name: eslint
      run: pnpm exec eslint --fix {staged_files}
      glob: '*.{ts,tsx,js,jsx}'
      stage_fixed: true
    - name: prettier
      run: pnpm exec prettier --write {staged_files}
      glob: '*.{ts,tsx,js,jsx,css,json,md,yml,yaml}'
      stage_fixed: true
