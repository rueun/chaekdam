name: CI

# 로컬 = CI 동일 동작(tooling.md). PR·main push 마다 lint·타입·테스트·빌드를 게이트한다.
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소(자원 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 외부 의존 없는 빠른 게이트 — lint · 포맷 · 타입 · 단위 테스트 · 빌드.
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 버전은 package.json packageManager 에서 읽음

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (oxlint + eslint)
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm exec vitest run # `pnpm test` 는 watch 라 CI 에선 run 사용

      - name: Build
        run: pnpm build
        env:
          # 빌드 시 모듈 평가가 env 를 읽어도 실패하지 않도록 placeholder(런타임 호출은 요청 시점).
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-anon-key

  # 실제 로컬 Supabase(Docker)에 대한 통합 테스트 — RLS·Storage 까지 검증(testing.md).
  integration:
    name: Integration (Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start Supabase (applies migrations)
        run: pnpm exec supabase start

      - name: Export Supabase env
        shell: bash
        run: |
          # 로컬 데모 키(공개) — secret 불필요. status 출력을 앱 변수명으로 매핑.
          source <(pnpm exec supabase status -o env 2>/dev/null)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Integration tests
        run: pnpm test:integration

      - name: Stop Supabase
        if: always()
        run: pnpm exec supabase stop
